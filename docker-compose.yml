# Capital Control — one deployment, one business.
#
# Sell the software outright and each customer gets their own stack, database
# and volume. Run it as a service and several lenders share one: every
# tenant-scoped table is under Row-Level Security, so the database itself
# refuses to hand one organization another's rows.
#
#   1. cp .env.example .env   and fill in real values
#   2. docker compose up -d
#   3. docker compose exec app npm run db:deploy
#   4. docker compose exec app npm run db:seed
#
# TLS is not optional. Session cookies are Secure in production, so over plain
# HTTP the browser discards them and nobody can log in — the login form simply
# returns to itself. Caddy below obtains and renews a certificate on its own;
# set APP_DOMAIN to the hostname that points at this server.
#
# See docs/DEPLOY.md for the full VPS walkthrough.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-capital_control}
      # Colombian collation, so ORDER BY puts "Ñuñez" where a person expects it.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-CO --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Backups land here; see docs/BACKUP.md.
      - ./backups:/backups
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capital} -d ${POSTGRES_DB:-capital_control}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default: only the app needs to reach the database.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-capital}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-capital_control}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: https://${APP_DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@capitalcontrol.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-Mi Negocio}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-mi-negocio}
      # Demo data is never loaded into a real deployment.
      SEED_DEMO_DATA: "false"
      TZ: ${TZ:-America/Bogota}
    # Not published to the host: Caddy is the only way in, so the application
    # is never reachable over plain HTTP from outside.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
